<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070b">
  <title>HX2B • My Socials</title>
  <meta name="description" content="HX2B — all my socials in one place.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#03050a;color:#fff}
    body{
      background:
        radial-gradient(circle at 50% 10%,rgba(40,120,255,.22),transparent 34%),
        radial-gradient(circle at 10% 80%,rgba(0,90,255,.12),transparent 28%),
        linear-gradient(145deg,#020307,#07101d 55%,#020307);
      overflow-x:hidden;
    }
    .wrap{max-width:620px;margin:auto;padding:34px 18px 44px}
    .hero{text-align:center;padding:10px 0 18px}
    .crown{font-size:42px;filter:drop-shadow(0 0 14px #398bff);margin-bottom:4px}
    .logo{
      margin:0;font-size:clamp(58px,17vw,108px);line-height:.86;font-weight:950;
      letter-spacing:-.07em;color:#dbe8ff;
      text-shadow:0 2px 0 #fff,0 0 7px #75adff,0 0 28px #146cff,8px 8px 0 #17263e;
    }
    .sub{margin:18px 0 4px;font-size:13px;letter-spacing:.28em;color:#9bbcff;font-weight:800}
    .tag{margin:0;color:#b7c1d1;font-size:14px}
    .links{display:grid;gap:14px;margin-top:22px}
    .card{
      display:flex;align-items:center;gap:16px;min-height:78px;padding:13px 18px;
      border:1px solid rgba(105,165,255,.5);border-radius:20px;
      background:linear-gradient(120deg,rgba(10,18,32,.96),rgba(4,8,15,.92));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(15,105,255,.12);
      text-decoration:none;color:#fff;transition:.18s ease;position:relative;overflow:hidden
    }
    .card:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(100,170,255,.08),transparent);transform:translateX(-100%);transition:.45s}
    .card:hover{transform:translateY(-3px);border-color:#80b7ff;box-shadow:0 0 26px rgba(22,117,255,.28),inset 0 1px 0 rgba(255,255,255,.1)}
    .card:hover:before{transform:translateX(100%)}
    .icon{
      width:48px;height:48px;display:grid;place-items:center;border-radius:15px;flex:0 0 48px;
      background:linear-gradient(145deg,#dceaff,#669cff 55%,#0d4fc0);
      color:#06101f;font-size:24px;font-weight:950;box-shadow:0 0 18px rgba(65,143,255,.35)
    }
    .info{min-width:0;flex:1}.name{font-weight:900;font-size:17px}.handle{color:#9eabc0;font-size:14px;margin-top:2px}
    .arrow{font-size:25px;color:#8dbaff}
    .copy{cursor:pointer}
    .notice{text-align:center;color:#77869d;font-size:12px;margin:17px 4px 0}
    footer{text-align:center;margin-top:30px;color:#718098;font-size:12px;letter-spacing:.12em}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0d1d35;border:1px solid #508eff;border-radius:999px;padding:10px 16px;font-size:13px;transition:.2s;box-shadow:0 0 22px rgba(30,120,255,.3)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="crown">♛</div>
      <h1 class="logo">HX2B</h1>
      <div class="sub">MY SOCIALS</div>
      <p class="tag">Stay connected to Monster</p>
    </header>

    <section class="links" aria-label="Social links">
      <a class="card" href="https://www.tiktok.com/@jvrs" target="_blank" rel="noopener">
        <div class="icon">♪</div><div class="info"><div class="name">TikTok</div><div class="handle">@jvrs</div></div><div class="arrow">›</div>
      </a>
      <a class="card" href="https://www.instagram.com/dxat/" target="_blank" rel="noopener">
        <div class="icon">◎</div><div class="info"><div class="name">Instagram</div><div class="handle">@dxat</div></div><div class="arrow">›</div>
      </a>
      <button class="card copy" data-copy="HX2B" aria-label="Copy PlayStation username">
        <div class="icon">PS</div><div class="info"><div class="name">PlayStation</div><div class="handle">HX2B • tap to copy</div></div><div class="arrow">›</div>
      </button>
      <button class="card copy" data-copy="dxatt" aria-label="Copy Discord username">
        <div class="icon">◉</div><div class="info"><div class="name">Discord</div><div class="handle">dxatt • tap to copy</div></div><div class="arrow">›</div>
      </button>
      <a class="card" href="https://t.me/dxattt" target="_blank" rel="noopener">
        <div class="icon">➤</div><div class="info"><div class="name">Telegram</div><div class="handle">@dxattt</div></div><div class="arrow">›</div>
      </a>
    </section>

    <p class="notice">PlayStation and Discord are shown as copy-to-clipboard buttons because usernames alone don't provide a universal public profile URL.</p>
    <footer>HX2B • STAY CONNECTED TO MONSTER</footer>
  </main>
  <div class="toast" id="toast">Copied!</div>
  <script>
    const toast=document.getElementById('toast');
    document.querySelectorAll('.copy').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const value=btn.dataset.copy;
        try{await navigator.clipboard.writeText(value)}
        catch(e){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
        toast.textContent=`${value} copied`;
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'),1400);
      });
    });
  </script>
</body>
</html>
